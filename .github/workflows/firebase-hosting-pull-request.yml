name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          
      # Install dependencies and build web
      - run: flutter pub get
      - run: flutter build web --web-renderer html
      
      # Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPDISTRIBUTIONTEST_77E17 }}
          projectId: appdistributiontest-77e17
          target: public  # This should match your firebase.json public directory

